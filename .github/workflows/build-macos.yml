name: Build macOS desktop

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: matrix-co branch, tag, or commit SHA to build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ad-hoc signed macOS desktop
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out private Matrix Co source
        uses: actions/checkout@v6
        with:
          repository: moonaries90/matrix-co
          ref: ${{ inputs.source_ref }}
          path: matrix-co
          ssh-key: ${{ secrets.MATRIX_CO_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Require Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]]

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            matrix-co/apps/desktop/package-lock.json
            matrix-co/packages/claude-sdk-agent/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            matrix-co -> target
            matrix-co/apps/desktop/src-tauri -> target

      - name: Record toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Build macOS app and DMG
        shell: bash
        working-directory: matrix-co
        run: ./scripts/package-desktop.sh

      - name: Verify app, DMG, architecture, and checksums
        shell: bash
        working-directory: matrix-co
        run: |
          set -euo pipefail
          dist="dist/matrix-co-desktop"
          app="$dist/Matrix Co.app"
          dmg="$dist/Matrix Co.dmg"
          test -d "$app"
          test -f "$dmg"
          test -x "$app/Contents/MacOS/matrix-desktop"
          test -x "$app/Contents/MacOS/matrixd"
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "$dmg"
          file "$app/Contents/MacOS/matrix-desktop" | grep -q "arm64"
          shasum -a 256 "$dmg" > "$dist/SHA256SUMS-macos"

      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: matrix-co-desktop-macos-${{ github.run_number }}
          path: |
            matrix-co/dist/matrix-co-desktop/Matrix Co.dmg
            matrix-co/dist/matrix-co-desktop/SHA256SUMS-macos
          if-no-files-found: error
          retention-days: 14

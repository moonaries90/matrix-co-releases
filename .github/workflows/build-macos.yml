name: Build macOS desktop

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: nonet branch, tag, or commit SHA to build
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: macos-desktop-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package non-publishable ad-hoc macOS desktop
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out private Nonet source
        uses: actions/checkout@v6
        with:
          repository: moonaries90/nonet
          ref: ${{ inputs.source_ref }}
          path: nonet
          ssh-key: ${{ secrets.MATRIX_CO_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Require Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "arm64" ]]

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            nonet/apps/desktop/package-lock.json
            nonet/packages/claude-sdk-agent/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            nonet -> target
            nonet/apps/desktop/src-tauri -> target

      - name: Record toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Build macOS app and DMG
        shell: bash
        working-directory: nonet
        env:
          NONET_CO_HOME: ${{ runner.temp }}/nonet-home
        run: bash scripts/package-desktop-local.sh

      - name: Verify non-publishable app, DMG, architecture, and checksums
        shell: bash
        working-directory: nonet
        run: |
          set -euo pipefail
          dist="dist/nonet-desktop-local"
          app="$dist/Nonet.app"
          dmg="$dist/Nonet.dmg"
          test -d "$app"
          test -f "$dmg"
          test -x "$app/Contents/MacOS/nonet-desktop"
          test -x "$app/Contents/MacOS/nonetd"
          details="$(codesign -d --verbose=4 "$app" 2>&1)"
          grep -Eq '(^Signature=adhoc$|flags=.*\(adhoc\))' <<<"$details"
          codesign -dv --verbose=4 "$app"
          codesign -dr - "$app"
          hdiutil verify "$dmg"
          file "$app/Contents/MacOS/nonet-desktop" | grep -q "arm64"
          shasum -a 256 "$dmg" > "$dist/SHA256SUMS-macos"

      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: nonpublishable-adhoc-nonet-desktop-macos-${{ github.run_number }}
          path: |
            nonet/dist/nonet-desktop-local/Nonet.dmg
            nonet/dist/nonet-desktop-local/SHA256SUMS-macos
          if-no-files-found: error
          retention-days: 14
